name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $d = "NXE-Launcher"
          New-Item -ItemType Directory -Force "$d/theme/covers","$d/theme/sounds","$d/theme/gamerpics" | Out-Null
          Copy-Item target/release/nxe-launcher.exe,README.md,LICENSE $d
          Compress-Archive -Path $d -DestinationPath "NXE-Launcher-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NXE-Launcher-windows-x64
          path: NXE-Launcher-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NXE-Launcher-*.zip
          generate_release_notes: true
